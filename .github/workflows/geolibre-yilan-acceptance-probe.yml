name: GeoLibre Yilan Acceptance Recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/geolibre-yilan-acceptance-probe.yml"\n      - "tmp/geolibre_yilan_full.py"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geospatial tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
          python -m pip install --disable-pip-version-check requests pandas geopandas pyogrio shapely

      - name: Download and clip current Taiwan OSM for Yilan
        run: |
          mkdir -p tmp/custom_files
          chmod 777 tmp/custom_files
          curl -L --fail --retry 3 --retry-delay 5             -o tmp/taiwan-latest.osm.pbf             https://download.geofabrik.de/asia/taiwan-latest.osm.pbf
          sha256sum tmp/taiwan-latest.osm.pbf | tee tmp/taiwan-latest.osm.pbf.sha256
          osmium extract             --strategy=complete_ways             -b 121.25,24.20,122.15,25.20             -o tmp/custom_files/yilan-buffer.osm.pbf             tmp/taiwan-latest.osm.pbf
          sha256sum tmp/custom_files/yilan-buffer.osm.pbf | tee tmp/custom_files/yilan-buffer.osm.pbf.sha256
          rm -f tmp/taiwan-latest.osm.pbf

      - name: Start private Valhalla pedestrian graph
        run: |
          docker pull ghcr.io/valhalla/valhalla-scripted:latest
          docker run -d --name valhalla             -p 8002:8002             -v "$PWD/tmp/custom_files:/custom_files"             -e use_tiles_ignore_pbf=False             -e force_rebuild=True             -e build_elevation=False             -e build_admins=False             -e build_time_zones=False             -e build_transit=False             -e build_tar=True             -e server_threads=2             ghcr.io/valhalla/valhalla-scripted:latest

      - name: Wait for Valhalla
        run: |
          ok=0
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:8002/status > tmp/valhalla-status.json; then
              ok=1
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx valhalla; then
              docker logs valhalla || true
              exit 1
            fi
            sleep 4
          done
          if [ "$ok" != "1" ]; then
            docker logs valhalla || true
            exit 1
          fi
          cat tmp/valhalla-status.json

      - name: Build acceptance data package
        id: recovery
        continue-on-error: true
        env:
          VALHALLA_URL: http://127.0.0.1:8002
        run: python tmp/geolibre_yilan_full.py

      - name: Preserve routing provenance
        if: always()
        run: |
          mkdir -p tmp/geolibre-yilan-full-output
          cp tmp/valhalla-status.json tmp/geolibre-yilan-full-output/valhalla-status.json || true
          cp tmp/custom_files/yilan-buffer.osm.pbf.sha256 tmp/geolibre-yilan-full-output/yilan-buffer.osm.pbf.sha256 || true
          docker logs valhalla > tmp/geolibre-yilan-full-output/valhalla-build.log 2>&1 || true

      - name: Upload acceptance package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geolibre-yilan-acceptance-recovery
          path: tmp/geolibre-yilan-full-output
          if-no-files-found: error
          retention-days: 7

      - name: Enforce acceptance inputs
        if: steps.recovery.outcome != 'success'
        run: exit 1
